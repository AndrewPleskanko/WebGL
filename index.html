<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>CGW - Texture Coordinate Scaling (Variant 11)</title>
    <style>
        body {
            background-color: #EEEEEE;
            font-family: sans-serif;
        }

        canvas {
            background-color: #CCCCCC;
        }

        .controls {
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 10px;
            border-radius: 5px;
        }
    </style>
    <script src="./Utils/trackball-rotator.js"></script>
    <script src="./Utils/m4.js"></script>
    <script src="./Model.js"></script>
    <script src="./main.js"></script>
</head>
<body onload="init()">
<h2>CGW: Texture Coordinate Scaling (Variant 11)</h2>
<p id="message">Drag your mouse on the surface to rotate it.</p>
<div class="controls">
    <label>U Segments: <span id="u-val">40</span></label>
    <input type="range" id="u-slider" min="3" max="100" value="40">
    <br>
    <label>V Segments: <span id="v-val">40</span></label>
    <input type="range" id="v-slider" min="3" max="100" value="40">
    <hr style="border-color: #555; margin: 10px 0;">
    <strong>Texture Scaling Controls:</strong><br>
    <label>Pivot Point: <span id="pivot-display">U: 0.50, V: 0.50</span></label><br>
    <label>Scale Factor: <span id="scale-display">1.00</span></label><br>
    <br>
    <small>
        <b>W/S</b> - Move pivot along V axis<br>
        <b>A/D</b> - Move pivot along U axis<br>
        <b>Q/E</b> - Decrease/Increase scale<br>
        <b>R</b> - Reset to defaults
    </small>
</div>
<div id="canvas-holder">
    <canvas width="600" height="600" id="webglcanvas"></canvas>
</div>
</body>
</html>
