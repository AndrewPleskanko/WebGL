<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>PA#3 - Cassini Surface (Normal Mapping)</title>
    <style>
        body {
            background-color: #EEEEEE;
            font-family: sans-serif;
        }

        canvas {
            background-color: black;
        }

        .controls {
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 10px;
            border-radius: 5px;
        }
    </style>
    <script src="./Utils/trackball-rotator.js"></script>
    <script src="./Utils/m4.js"></script>
    <script src="./Model.js"></script>
    <script src="./main.js"></script>
</head>
<body onload="init()">
<h2>PA#3: Cassini Surface (Normal Mapping with Textures)</h2>
<p id="message">Drag your mouse on the surface to rotate it.</p>
<div class="controls">
    <label>U Segments: <span id="u-val">40</span></label>
    <input type="range" id="u-slider" min="3" max="100" value="40">
    <br>
    <label>V Segments: <span id="v-val">40</span></label>
    <input type="range" id="v-slider" min="3" max="100" value="40">
</div>
<div id="canvas-holder">
    <canvas width="600" height="600" id="webglcanvas"></canvas>
</div>
</body>
</html>
